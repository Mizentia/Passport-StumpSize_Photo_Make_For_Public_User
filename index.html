  <script>
    (function() {
      try {
        var dbLogo = 'https://res.cloudinary.com/ayewcaxj/image/upload/v1790432997/ChatGPT_Image_Sep_26_2026_08_27_13_PM_ufluye.png';
        var logo = localStorage.getItem('public_project_logo') || localStorage.getItem('studio_project_logo') || dbLogo;
        if (!localStorage.getItem('public_project_logo')) {
          localStorage.setItem('public_project_logo', dbLogo);
        }
        var fav = document.getElementById('appFavicon');
        var sc = document.getElementById('appShortcutIcon');
        var ap = document.getElementById('appAppleIcon');
        if (fav) fav.href = logo;
        if (sc) sc.href = logo;
        if (ap) ap.href = logo;
      } catch (_) {}
    })();
